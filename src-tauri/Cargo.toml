[package]
name = "taby-custom-agent"
version = "1.0.0"
description = "Custom Taby Agent — desktop overlay"
authors = ["AstroLabs"]
edition = "2021"

[lib]
name = "taby_custom_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mouse_position = "0.1.4"
serialport = "4.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# Do NOT abort — we need panic hooks to write startup.log
panic = "unwind"
strip = true

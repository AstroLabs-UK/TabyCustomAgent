# Build Windows installer (NSIS + MSI). On push to main/master or v* tags,
# publish a real GitHub *Release* (not tag-only) with install tutorial + assets.
#
# Uses tauri-apps/tauri-action for the build only, then softprops/action-gh-release
# so continuous builds become proper Releases with downloadable assets.

name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development
          npm_config_registry: https://registry.npmjs.org/

      - name: Verify frontend toolchain (reinstall if needed)
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/vite/bin/vite.js") -or -not (Test-Path "node_modules/typescript/bin/tsc")) {
            Write-Host "Toolchain incomplete after npm ci — running npm install fallback"
            npm install --include=dev --registry=https://registry.npmjs.org/
          }
          if (-not (Test-Path "node_modules/vite/bin/vite.js")) {
            Write-Error "vite still missing after npm install"
            exit 1
          }
          node ./node_modules/vite/bin/vite.js --version
        env:
          NODE_ENV: development
          npm_config_registry: https://registry.npmjs.org/

      - name: Vite production build (fail fast)
        run: npm run build
        env:
          npm_config_registry: https://registry.npmjs.org/

      # Build only — do NOT let tauri-action create tags/releases (that path
      # was producing tag-only artifacts without a real Release).
      - name: Build Tauri app (Windows NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: node scripts/run-tauri.mjs
          args: --bundles nsis,msi
          # Explicitly no release from this action:
          releaseDraft: false
          tagName: ""
          releaseName: ""

      - name: Upload Windows build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: taby-custom-agent-windows-exe
          path: |
            src-tauri/target/release/taby-custom-agent.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      - name: Stage release assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $paths = @(
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/taby-custom-agent.exe"
          )
          foreach ($p in $paths) {
            Get-ChildItem -Path $p -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-assets/" -Force
              Write-Host "Staged: $($_.Name)"
            }
          }
          if (-not (Get-ChildItem release-assets -ErrorAction SilentlyContinue)) {
            Write-Error "No release assets found under src-tauri/target/release"
            Get-ChildItem -Path "src-tauri/target/release" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 40 FullName
            exit 1
          }
          Get-ChildItem release-assets | Format-Table Name, Length

      # Create a real GitHub *Release* (Releases page), not a bare tag (Tags page).
      # Uses GitHub CLI: https://cli.github.com/manual/gh_release_create
      - name: Publish GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            TITLE="${GITHUB_REF_NAME}"
            PRE_FLAG=()
          else
            # Unique tag per run; still creates a Release entry under /releases
            TAG="continuous-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}"
            TITLE="Continuous build ${GITHUB_REF_NAME} #${GITHUB_RUN_NUMBER}"
            PRE_FLAG=(--prerelease)
          fi

          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<'NOTES'
          ## Custom Taby Agent — Windows build

          This is a **GitHub Release** on the **Releases** page (with assets), not a tag-only entry.

          The **NSIS setup `.exe`** installs the app **and** required runtime dependencies
          (Microsoft Edge WebView2 via silent bootstrapper when missing).

          ### Install (Windows)

          1. Download **`Custom Taby Agent_*_x64-setup.exe`** (NSIS) from **Assets** below.
          2. Run the installer (allow WebView2 bootstrap if prompted/needed).
          3. Launch **Custom Taby Agent**.
          4. **Settings** → paste your **API key** and confirm the **API endpoint**
             (Groq: `https://api.groq.com/openai/v1`).
          5. Optional BLE: close the official Hey Taby app before pairing.

          ### Other assets

          - **MSI** — silent / enterprise deploy
          - **Portable `.exe`** — no installer (WebView2 must already be present)

          ### Notes

          - No API keys are bundled.
          - Unsigned continuous builds are expected for v1.
          - Repo: https://github.com/AstroLabs-UK/TabyCustomAgent
          NOTES

          # Append build identity (expanded by bash, not heredoc-quoted)
          {
            echo ""
            echo "---"
            echo "*SHA \`${GITHUB_SHA}\` · run \`${GITHUB_RUN_NUMBER}\`*"
          } >> "$NOTES_FILE"

          # Collect asset files (must be non-empty)
          mapfile -t ASSETS < <(find release-assets -type f | sort)
          if [[ ${#ASSETS[@]} -eq 0 ]]; then
            echo "No files in release-assets/" >&2
            exit 1
          fi
          echo "Assets to upload:"
          printf '  %s\n' "${ASSETS[@]}"

          # If a release for this tag already exists, delete it so we republish cleanly
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG to republish..."
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          # Create the Release on the Releases page, targeting this commit
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "$TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${GITHUB_SHA}" \
            "${PRE_FLAG[@]}"

          echo "Verifying release exists on Releases API..."
          gh release view "$TAG" --json url,isDraft,isPrerelease,tagName,assets \
            --jq '{url,isDraft,isPrerelease,tagName,assetCount:(.assets|length)}'

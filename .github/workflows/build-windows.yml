# Build Windows installer (.exe / NSIS) on every push to main (and tags),
# upload CI artifacts, and publish a GitHub Release with install tutorial.
#
# The NSIS installer embeds the app and uses Tauri's WebView2 download
# bootstrapper so required runtime dependencies are installed for the user.

name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        # NODE_ENV=production on runners skips devDependencies; CLI lives there.
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Verify Tauri CLI is installed
        shell: pwsh
        run: |
          Write-Host "Listing @tauri-apps packages:"
          Get-ChildItem node_modules/@tauri-apps -ErrorAction SilentlyContinue | Format-Table Name
          if (-not (Test-Path "node_modules/@tauri-apps/cli/tauri.js")) {
            Write-Error "Missing node_modules/@tauri-apps/cli/tauri.js after npm ci"
            exit 1
          }
          if (-not (Test-Path "node_modules/@tauri-apps/cli-win32-x64-msvc")) {
            Write-Warning "Optional native binary @tauri-apps/cli-win32-x64-msvc not present — CLI may still work via fallback"
          }
          node ./node_modules/@tauri-apps/cli/tauri.js --version

      - name: Build Tauri app (Windows NSIS + MSI)
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          NODE_ENV: production

      - name: Locate and list build outputs
        id: locate
        shell: pwsh
        run: |
          $release = "src-tauri/target/release"
          Write-Host "=== Release dir ==="
          Get-ChildItem -Path $release -Filter "*.exe" -ErrorAction SilentlyContinue | Format-Table Name, Length, LastWriteTime
          if (Test-Path "$release/bundle") {
            Write-Host "=== Bundle dir ==="
            Get-ChildItem -Path "$release/bundle" -Recurse -Include "*.exe","*.msi" -ErrorAction SilentlyContinue | Format-Table FullName, Length
          }

          # Prefer NSIS setup exe (installer that also handles WebView2)
          $nsis = Get-ChildItem -Path "$release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $msi  = Get-ChildItem -Path "$release/bundle/msi"  -Filter "*.msi" -ErrorAction SilentlyContinue | Select-Object -First 1
          $portable = Join-Path $release "taby-custom-agent.exe"

          if ($nsis) {
            Write-Host "NSIS installer: $($nsis.FullName)"
            "nsis=$($nsis.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          if ($msi) {
            Write-Host "MSI: $($msi.FullName)"
            "msi=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }
          if (Test-Path $portable) {
            Write-Host "Portable: $portable"
            "portable=$portable" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Upload Windows build artifacts (CI)
        uses: actions/upload-artifact@v4
        with:
          name: taby-custom-agent-windows-exe
          path: |
            src-tauri/target/release/taby-custom-agent.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      # Publish GitHub Release on push to main/master or on version tags
      - name: Prepare release assets folder
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $paths = @(
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/taby-custom-agent.exe"
          )
          foreach ($p in $paths) {
            Get-ChildItem -Path $p -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination "release-assets/" -Force
              Write-Host "Staged: $($_.Name)"
            }
          }
          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Create / update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          # Tags: use the tag name. Branch pushes: continuous tag per short SHA
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('continuous-{0}', github.sha) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Continuous build ({0})', github.ref_name) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          body: |
            ## Custom Taby Agent — Windows build

            This release includes a **Windows installer** that installs the app **and** required runtime dependencies (Microsoft Edge WebView2 via silent bootstrapper when missing).

            ### Recommended: NSIS installer (`.exe`)

            1. Download the **`Custom Taby Agent_*_x64-setup.exe`** (or similarly named NSIS setup) from **Assets** below.
            2. Run the installer. Allow it to finish (it may download WebView2 if your PC does not already have it).
            3. Launch **Custom Taby Agent** from the Start menu or desktop shortcut.
            4. Open **Settings** in the app → paste your **API key** and confirm the **API endpoint**
               (Groq default: `https://api.groq.com/openai/v1`).
            5. Optional: pair Physical Taby over BLE — **close the official Hey Taby app first**.

            ### Alternative packages

            - **MSI** — enterprise-style install if you prefer Group Policy / silent deploy.
            - **Portable `.exe`** (`taby-custom-agent.exe`) — no installer; still requires WebView2 on the machine. Prefer the NSIS setup for first-time installs.

            ### Notes

            - No API keys are bundled. Keys stay on your machine (Settings).
            - Unsigned build is normal for v1 continuous releases.
            - Source: https://github.com/AstroLabs-UK/TabyCustomAgent

            ---
            *Built by GitHub Actions on `${{ github.sha }}`*
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

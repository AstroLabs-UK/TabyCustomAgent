name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development
          npm_config_registry: https://registry.npmjs.org/

      - name: Verify frontend toolchain
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/vite/bin/vite.js")) {
            npm install --include=dev --registry=https://registry.npmjs.org/
          }
          if (-not (Test-Path "node_modules/vite/bin/vite.js")) {
            Write-Error "vite missing"
            exit 1
          }
        env:
          NODE_ENV: development

      - name: Vite production build
        run: npm run build

      - name: Build Tauri app (Windows NSIS + MSI)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: node scripts/run-tauri.mjs
          args: --bundles nsis,msi

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: taby-custom-agent-windows-exe
          path: |
            src-tauri/target/release/taby-custom-agent.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14

      - name: Stage release assets
        id: assets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $patterns = @(
            "src-tauri/target/release/bundle/nsis/*.exe",
            "src-tauri/target/release/bundle/msi/*.msi",
            "src-tauri/target/release/taby-custom-agent.exe"
          )
          foreach ($pat in $patterns) {
            Get-ChildItem -Path $pat -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName "release-assets/$($_.Name)" -Force
              Write-Host "Staged $($_.Name)"
            }
          }
          $count = (Get-ChildItem release-assets -File -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($count -lt 1) {
            Write-Error "No release assets staged"
            exit 1
          }
          "count=$count" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub Release (Releases page)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $title = $env:GITHUB_REF_NAME
            $preArgs = @()
          } else {
            $tag = "continuous-$($env:GITHUB_REF_NAME)-$($env:GITHUB_RUN_NUMBER)"
            $title = "Continuous build $($env:GITHUB_REF_NAME) #$($env:GITHUB_RUN_NUMBER)"
            $preArgs = @("--prerelease")
          }

          $notes = @"
          ## Custom Taby Agent — Windows build

          Published on the **Releases** page with downloadable installer assets.

          ### Install

          1. Download the NSIS **setup .exe** from Assets.
          2. Run it (WebView2 bootstrapper included when needed).
          3. Open **Settings** and paste your API key + endpoint.
          4. Optional BLE: close official Hey Taby first.

          SHA: $($env:GITHUB_SHA)
          Run: $($env:GITHUB_RUN_NUMBER)
          "@

          $notesFile = Join-Path $env:RUNNER_TEMP "release-notes.md"
          Set-Content -Path $notesFile -Value $notes -Encoding utf8

          # Remove prior release+tag if present so we always land a Release object
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Deleting existing release $tag"
            gh release delete $tag --yes --cleanup-tag
          }

          $files = @(Get-ChildItem -Path "release-assets" -File | ForEach-Object { $_.FullName })
          if ($files.Count -lt 1) { throw "No files to attach" }
          Write-Host "Creating release $tag with $($files.Count) assets"
          $files | ForEach-Object { Write-Host "  $_" }

          # Critical: gh release create publishes to Releases API (not tag-only)
          gh release create $tag @files `
            --title $title `
            --notes-file $notesFile `
            --target $env:GITHUB_SHA `
            @preArgs

          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

          # Prove it is a Release (has html_url on releases API)
          $json = gh release view $tag --json url,tagName,isDraft,isPrerelease,assets
          Write-Host $json
          $obj = $json | ConvertFrom-Json
          if (-not $obj.url) { throw "Release has no url — not on Releases page" }
          if ($obj.url -notmatch "/releases/") { throw "Unexpected release URL: $($obj.url)" }
          Write-Host "OK Release URL: $($obj.url)"

# Build Windows installer (NSIS + MSI). On push to main/master or v* tags,
# also publish a GitHub Release with install tutorial.
#
# Uses tauri-apps/tauri-action so the CLI is installed/invoked correctly on
# Windows (avoids fragile node_modules/.bin path issues).

name: Build Windows EXE

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci --include=dev
        env:
          NODE_ENV: development

      - name: Typecheck + Vite production build (fail fast)
        run: npm run build
        env:
          NODE_ENV: production

      - name: Decide whether to publish a GitHub Release
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == refs/tags/v* ) ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
              echo "prerelease=false" >> "$GITHUB_OUTPUT"
            else
              echo "tag=continuous-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
              echo "name=Continuous build (${{ github.ref_name }})" >> "$GITHUB_OUTPUT"
              echo "prerelease=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri app (Windows NSIS + MSI)
        if: steps.release.outputs.publish != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          # Action runs: <tauriScript> build <args>
          tauriScript: node scripts/run-tauri.mjs
          args: --bundles nsis,msi

      - name: Build Tauri app + GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: node scripts/run-tauri.mjs
          args: --bundles nsis,msi
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.name }}
          releaseDraft: false
          prerelease: ${{ steps.release.outputs.prerelease }}
          releaseBody: |
            ## Custom Taby Agent — Windows build

            This release includes a **Windows installer** that installs the app **and** required runtime dependencies (Microsoft Edge WebView2 via silent bootstrapper when missing).

            ### Recommended: NSIS installer (`.exe`)

            1. Download the **`Custom Taby Agent_*_x64-setup.exe`** (or similarly named NSIS setup) from **Assets** below.
            2. Run the installer. Allow it to finish (it may download WebView2 if your PC does not already have it).
            3. Launch **Custom Taby Agent** from the Start menu or desktop shortcut.
            4. Open **Settings** in the app → paste your **API key** and confirm the **API endpoint**
               (Groq default: `https://api.groq.com/openai/v1`).
            5. Optional: pair Physical Taby over BLE — **close the official Hey Taby app first**.

            ### Alternative packages

            - **MSI** — enterprise-style install if you prefer Group Policy / silent deploy.
            - Prefer the NSIS setup for first-time installs on a normal PC.

            ### Notes

            - No API keys are bundled. Keys stay on your machine (Settings).
            - Unsigned build is normal for v1 continuous releases.
            - Source: https://github.com/AstroLabs-UK/TabyCustomAgent

            ---
            *Built by GitHub Actions (`tauri-apps/tauri-action`) on `${{ github.sha }}`*

      - name: Upload Windows build artifacts (CI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taby-custom-agent-windows-exe
          path: |
            src-tauri/target/release/taby-custom-agent.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
          retention-days: 14
